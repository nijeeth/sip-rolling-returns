# GitHub turns off scheduled workflows after 60 days with no repository
# activity. This writes today's date into .github/keepalive.txt on the 1st
# and the 16th (about every 15 days) and commits it on main.
#
# The commit message contains [skip ci], so push-triggered workflows stay
# quiet. A push made with the default GITHUB_TOKEN also does not start other
# workflows. The file is not calculator code. Streamlit may rebuild from the
# commit; the app itself is unchanged.
#
# Change the timetable on the cron line. "15 0 1,16 * *" means 00:15 UTC on
# the 1st and the 16th of each month.

name: Keep automatic checks switched on

on:
  schedule:
    - cron: "15 0 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-date
  cancel-in-progress: false

jobs:
  update-date:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v6
        with:
          ref: main
          # Full history so a rebase still works if main moved during the run.
          fetch-depth: 0

      - name: Write today's date
        run: |
          {
            echo "# Last activity date (UTC). Updated automatically so GitHub keeps scheduled checks on."
            date -u +%Y-%m-%d
          } > .github/keepalive.txt

      - name: Commit the date
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then
            echo "Keepalive date is already today. Nothing to commit."
            exit 0
          fi
          git commit -m "chore: keepalive date update [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Committed the keepalive date to main."
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            echo "Updated .github/keepalive.txt on main ($(date -u +%Y-%m-%d))." >> "$GITHUB_STEP_SUMMARY"
          fi

# Opens the public calculator three times a day and presses the wake-up
# button when Streamlit has put it to sleep.
#
# Times are UTC: 01:00, 09:00, and 17:00.
# New Zealand daylight time (late September to early April): 2:00 pm, 10:00 pm, 6:00 am.
# New Zealand standard time: 1:00 pm, 9:00 pm, 5:00 am.
#
# Change the timetable on the cron line below. It is minute, hour, day, month,
# weekday. GitHub sometimes starts a scheduled run a little late.

name: Keep the calculator awake

on:
  schedule:
    - cron: "0 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the browser used for the check
        run: |
          python -m pip install "playwright==1.65.2"
          python -m playwright install --with-deps chromium

      - name: Open the calculator and wake it if it is asleep
        env:
          STREAMLIT_APP_URL: ${{ vars.STREAMLIT_APP_URL }}
          KEEP_AWAKE_SCREENSHOT: ${{ runner.temp }}/keep-awake-failure.png
        run: python .github/scripts/keep_awake.py

      - name: Upload a picture of the page if the check failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: keep-awake-failure
          path: ${{ runner.temp }}/keep-awake-failure.png
          if-no-files-found: ignore
